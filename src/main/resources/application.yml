spring:
  application:
    name: keycloak-integration-test
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/employees}
    username: ${DATABASE_USERNAME:employees}
    password: ${DATABASE_PASSWORD:local-employees-password}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BFFSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/demo}
  internal-base-uri: ${KEYCLOAK_INTERNAL_BASE_URI:${keycloak.issuer-uri}}
  client-id: ${KEYCLOAK_CLIENT_ID:demo-bff}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:local-bff-secret}
  api-client-id: demo-api

bff:
  public-url: ${BFF_PUBLIC_URL:http://127.0.0.1:5173}

vision:
  base-url: ${CV_SERVICE_URL:http://127.0.0.1:8000}

employees:
  similarity-threshold: ${FACE_SIMILARITY_THRESHOLD:0.5}
  ambiguity-margin: ${FACE_AMBIGUITY_MARGIN:0.05}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
