name: Build and integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon clean build
      - name: Start Keycloak
        run: docker compose up -d --wait keycloak
      - name: Start API and verify real tokens
        run: |
          java -jar build/libs/app.jar > api.log 2>&1 &
          python3 scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          cat api.log 2>/dev/null || true
      - name: Stop Keycloak
        if: always()
        run: docker compose down -v
